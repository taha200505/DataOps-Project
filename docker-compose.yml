version: '3.8'

services:
  # ==========================================
  # HADOOP HDFS (Stockage)
  # ==========================================
  namenode:
    image: apache/hadoop:3.3.6
    container_name: dataproc-namenode
    hostname: namenode
    user: root
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - namenode-data:/opt/hadoop/data/nameNode
    ports:
      - "9870:9870"
      - "9000:9000"
    command: >
      bash -c "
      mkdir -p /opt/hadoop/data/nameNode &&
      chown -R hadoop:hadoop /opt/hadoop/data/nameNode &&
      if [ ! -d /opt/hadoop/data/nameNode/current ]; then
        su -s /bin/bash hadoop -c 'hdfs namenode -format -force';
      fi;
      exec su -s /bin/bash hadoop -c 'hdfs namenode'
      "
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dataproc

  datanode:
    image: apache/hadoop:3.3.6
    container_name: dataproc-datanode
    hostname: datanode
    user: root
    depends_on:
      - namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - datanode-data:/opt/hadoop/data/dataNode
    ports:
      - "9864:9864"
    command: >
      bash -c "
      mkdir -p /opt/hadoop/data/dataNode &&
      chown -R hadoop:hadoop /opt/hadoop/data/dataNode &&
      exec su -s /bin/bash hadoop -c 'hdfs datanode'
      "
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dataproc

  # ==========================================
  # APACHE SPARK (Traitement)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.1
    container_name: dataproc-spark-master
    hostname: spark-master
    user: root
    ports:
      - "8080:8080" # Spark Master UI
      - "7077:7077" # Port l-Jupyter bach y-tconnecta
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dataproc

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: dataproc-spark-worker-1
    hostname: spark-worker-1
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits:
          memory: 1536M 
    networks:
      - dataproc

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: dataproc-spark-worker-2
    hostname: spark-worker-2
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - dataproc

  # ==========================================
  # JUPYTER (Workspace)
  # ==========================================
  jupyter:
    build:
      context: ./jupyter
    container_name: dataproc-jupyter
    hostname: jupyter
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    environment:
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./notebooks:/home/jovyan/work
    ports:
      - "8888:8888"
      - "4040:4040" # Spark Driver UI
    command: >
      start-notebook.py
      --NotebookApp.token=''
      --NotebookApp.password=''
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - dataproc

  # ==========================================
  # MONITORING (Grafana & Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: dataproc-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dataproc

  grafana:
    image: grafana/grafana:latest
    container_name: dataproc-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dataproc

networks:
  dataproc:
    driver: bridge

volumes:
  namenode-data:
  datanode-data: